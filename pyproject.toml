[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
telco-churn-mlops = "telco_churn_mlops:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
